# Runs SimCoach's offline tests (tools/run_tests.sh) and checks the package lock still matches sim_coach.py's
# dependency list, on every pull request and every push to main.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test tools
        run: python -m pip install --disable-pip-version-check numpy openai pyflakes lupa uv==0.11.32
      - name: Offline tests
        run: PYTHON=python tools/run_tests.sh
      - name: sim_coach.py.lock matches sim_coach.py's dependencies
        run: uv lock --script sim_coach.py --check
