# Checks reference laps shared from SimCoach: every pull request that only adds or changes files in references/ is
# checked (complete, clean, believable lap, faster than the library's lap). Good laps from the owner, collaborators
# or logins in the LIBRARY_TRUSTED repository variable are committed straight in; anyone else's wait, labelled
# "library-review", until the owner adds the "library-approved" label. Laps are committed as SimCoach's canonical
# JSON, not the submitted bytes. Nothing from the pull request runs: the checker comes from main and only reads the
# submitted files as data.
name: Library auto-add

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]
    paths: ["references/**"]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: library-auto-add-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    if: github.event.action != 'labeled' || github.event.label.name == 'library-approved'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check and add the shared laps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIBRARY_TRUSTED: ${{ vars.LIBRARY_TRUSTED }}
        run: python tools/references/review_submission.py
